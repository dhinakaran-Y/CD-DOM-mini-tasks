<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search List | Dhinakaran-Y</title>
    <link rel="stylesheet" href="./src/css/style.css">
</head>

<body class="bg-brand-navy-dark/95">
    <header class="bg-brand-navy-dark flex pt-3 pb-4.5 justify-between">
        <div class=""><span class="invisible">back</span></div>
        <!-- input -->
        <div class="relative justify-items-center text-white/50 items-center w-xs pl-2 mx-auto">
            <input type="search"
                class="border rounded py-1 w-full bg-brand-navy-dark/10 absolute border-gray-50/50 focus:border-gray-50/90 placeholder:text-white/50 px-3 focus:outline-none"
                id="search" name="search" placeholder="Search language by name">
            <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" class="absolute top-1.5 right-0 "
                viewBox="0 0 24 24">
                <path fill="currentColor"
                    d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 0 0 1.48-5.34c-.47-2.78-2.79-5-5.59-5.34a6.505 6.505 0 0 0-7.27 7.27c.34 2.8 2.56 5.12 5.34 5.59a6.5 6.5 0 0 0 5.34-1.48l.27.28v.79l4.25 4.25c.41.41 1.08.41 1.49 0s.41-1.08 0-1.49zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5S14 7.01 14 9.5S11.99 14 9.5 14" />
            </svg>
        </div>
        <!-- home navigation -->
        <div class="flex justify-items-center items-center" id="nav-list">
            <a href="./index.html" class="mr-3 text-white/80 hover:text-white!"><svg xmlns="http://www.w3.org/2000/svg" width="25" height="25"
                viewBox="0 0 24 24">
                <path fill="currentColor" d="m12 5.69l5 4.5V18h-2v-6H9v6H7v-7.81zM12 3L2 12h3v8h6v-6h2v6h6v-8h3z" />
            </svg></a>
        </div>
    </header>

    <!-- main -->
    <main class="w-3xl rounded mx-auto p-5 text-white">
        <h2 class="text-center text-3xl font-semibold mb-2">Programming Languages</h2>
        <p class="text-center text-white/80 mb-5">Search and find language details.</p>
        <!-- li -->
         <div class=" bg-gray-50 py-5 rounded-xl">
        <ul class="">
            <div class="w-full">
                <p class="text-brand-navy-dark my-10 text-center hidden w-full p-10 rounded justify-items-center" id="no-result-span">
                    <span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="mx-auto" width="52" height="52"
                        viewBox="0 0 24 24">
                        <path fill="currentColor"
                            d="M7.5 16.5H9V15h6v1.5h1.5V15H15v-1.5H9V15H7.5v1.5ZM8 12h1.5V9.5H8V12Zm6.5 0H16V9.5h-1.5V12ZM4 20q-.825 0-1.413-.588T2 18V6q0-.825.588-1.413T4 4h5.175q.4 0 .763.15t.637.425L12 6h8q.825 0 1.413.588T22 8v10q0 .825-.588 1.413T20 20H4Z" />
                    </svg>
                    </span>
                    No results found.</p>
                <table
                    class="border-collapse border-none rounded-2xl border-gray-400 **:border **:border-gray-300 **:px-3 **:py-1 **:text-black mx-auto w-[90%] text-center"
                    id="product-list-table">
                    <thead class="bg-brand-navy-dark/95">
                        <tr class="*:text-white! *:border-b-2">
                            <th>S.No</th>
                            <th>Language Name</th>
                        </tr>
                    </thead>
                    <tbody id="product-list-tbody" class="*:odd:bg-table-gray *:even:bg-table-white">
                        <tr class="list-row">
                            <td>0</td>
                            <td class="capitalize">item-0</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </ul>
        </div>
    </main>
    <!-- js -->
    <!-- <script src="./src/js/navLink.js"></script> -->
    <script type="module" src="/src/js/13_search-list.js"></script>
</body>

</html>
