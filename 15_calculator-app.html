<!DOCTYPE html>
<html lang="en" class="">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg" href="/calculator-svgrepo-com.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator App | Dhinakaran-Y</title>
    <link rel="stylesheet" href="./src/css/15_calculator-app.css">
</head>

<body class="dark:text-white">

    <!-- home navigation -->
    <div class="*:font-semibold space-x-2  *:px-2 *:py-1 *:hover:text-amber-500! fixed top-2 right-2" id="nav-list">
        <a href="./index.html" class="flex justify-center items-center space-x-2 text-black/60 hover:text-blue-500!"><svg
                xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" class="mr-1">
                <path fill="currentColor" d="m7.825 13l5.6 5.6L12 20l-8-8l8-8l1.425 1.4l-5.6 5.6H20v2z" />
            </svg>back to home</a>
    </div>

    <main class="">
        <div id="app" class="justify-center bg-amber-50 dark:bg-gray-900 min-h-screen dark:text-white py-25 || lg:flex">
            <div
                class="basis-2xl mx-auto bg-white/80 dark:bg-gray-800 min-w-xs max-w-xl 2xl:min-w-3xl p-5 sm:rounded-lg shadow-lg dark:border-gray-700">
                <!-- head -->
                <div class="text-3xl relative tracking-wider">Calculator
                    <!-- toggler -->
                    <div class="absolute top-0 right-2">
                        <label class="inline-flex items-center cursor-pointer">
                            <input type="checkbox" value="" id="theme-toggle-btn" class="sr-only peer">
                            <div
                                class="relative w-9 h-5 bg-gray-400 dark:bg-gray-700 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-amber-300 dark:peer-focus:ring-amber-400 rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-buffer after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white  after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-brand">
                            </div>
                            <span class="select-none ms-3 text-sm font-medium text-heading" id="toggle-span">Light mode</span>
                        </label>
                    </div>
                </div>
                <div class="">
                    <div class="px-5 uppercase text-right min-h-15">
                        <div class="text-sm mb-2 tracking-widest text-gray-500" id="operands"></div>
                        <div class="text-3xl pb-3" id="result">0</div>
                    </div>
                    <!-- body -->
                    <div class="flex">
                        <div class="w-8/12 pr-5">
                            <div class="grid grid-cols-3 gap-2 sm:gap-5">
                                <button type="button" class="btn-red" id="clearOperands">C</button>
                                <button type="button" class="btnStyle" data-operand>(</button>
                                <button type="button" class="btnStyle" data-operand>)</button>
                                <button type="button" class="btnStyle" data-operand value="7">7</button>
                                <button type="button" class="btnStyle" data-operand value="8">8</button>
                                <button type="button" class="btnStyle" data-operand value="9">9</button>
                                <button type="button" class="btnStyle" data-operand value="4">4</button>
                                <button type="button" class="btnStyle" data-operand value="5">5</button>
                                <button type="button" class="btnStyle" data-operand value="6">6</button>
                                <button type="button" class="btnStyle" data-operand value="1">1</button>
                                <button type="button" class="btnStyle" data-operand value="2">2</button>
                                <button type="button" class="btnStyle" data-operand value="3">3</button>
                                <button type="button" class="btnStyle col-span-2" data-operand value="0">0</button>
                                <button type="button" class="btnStyle" data-operand value=".">.</button>
                            </div>
                        </div>
                        <div class="w-4/12 grid grid-cols-2 gap-2 sm:gap-5">
                            <button type="button" class="btnOperand" data-operation value="/">/</button>
                            <!-- backspace -->
                            <button type="button" class="btn-red" id="backspace-btn">
                                <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" viewBox="0 0 24 24">
                                    <path fill="currentColor"
                                        d="m13.654 12.708l2.246 2.246q.14.14.344.15t.364-.15t.16-.354t-.16-.354L14.362 12l2.246-2.246q.14-.14.15-.344t-.15-.364t-.354-.16t-.354.16l-2.246 2.246l-2.246-2.246q-.14-.14-.344-.15q-.205-.01-.364.15q-.16.16-.16.354t.16.354L12.946 12L10.7 14.246q-.14.14-.15.345q-.01.203.15.363t.354.16t.354-.16zM9.173 19q-.379 0-.727-.164q-.348-.165-.565-.463l-4.135-5.385q-.342-.447-.342-.988t.342-.988l4.135-5.385q.217-.298.565-.462T9.173 5h10.212q.67 0 1.143.472q.472.472.472 1.144v10.769q0 .67-.472 1.143q-.472.472-1.143.472zm0-1h10.212q.269 0 .442-.173t.173-.442V6.615q0-.269-.173-.442T19.385 6H9.173q-.154 0-.279.058t-.221.173l-4.134 5.385q-.135.173-.135.384t.134.385l4.135 5.384q.096.116.221.173t.279.058m3.02-6" />
                                </svg>
                            </button>
                            <button type="button" class="btnOperand" data-operation value="-">*</button>
                            <button type="button" class="btnOperand pl-1" data-operation-2 value="square">x<sup
                                    class="text-[9px] p-0.5">2</sup></button>
                            <button type="button" class="btnOperand" data-operation value="+">-</button>
                            <!-- 2 -->
                            <button type="button" class="btnOperand" data-operation-2 value="power">x<sup
                                    class="text-[9px] p-0.5">y</sup></button>
                            <button type="button" class="btnOperand" data-operation value="*">+</button>
                            <button type="button" class="btnOperand" data-operation-2 value="square-root"><sup
                                    class="text-[9px]">2</sup>&#8730;x</button>
                            <button type="button" class="btnOperand" data-operation value="%">%</button>
                            <button type="button" class="btnEqual" id="equalOperator">=</button>
                        </div>
                    </div>
                </div>
            </div>
            <!-- history -->
            <div class="min-w-xs max-w-2xl mx-auto 2xl:min-w-xl text-end p-10">
                <ul id="history-li" class="relative dark:border bg-white/80 dark:bg-transparent p-15 h-full rounded-2xl shadow-lg shadow-black/40 dark:border-gray-600">
                    <h3
                        class="text-2xl text-center absolute w-full top-0 left-0 rounded-t-2xl mb-5 font-mono pt-2 bg-amber-100/70 dark:bg-white/5 pb-1">
                        History</h3>
                    <div class="absolute cursor-pointer hover:brightness-100 top-0 right-0 p-2 pb-3 rounded-tr-2xl border-black/10 hover:border-amber-300 active:rotate-3 dark:border-gray-600 hover:dark:border-gray-600 brightness-50 border-l border-b"
                        id="history-clear" title="clear">
                        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24">
                            <g fill="none">
                                <path d="M14 2h-4v8.5H4V15h16v-4.5h-6zM4 15v7h16v-7z" />
                                <path stroke="currentColor" stroke-linecap="square" stroke-width="1"
                                    d="M4 15v7h16v-7M4 15h16M4 15v-4.5h6V2h4v8.5h6V15m-5 7v-3" />
                            </g>
                        </svg>
                    </div>
                    <li class="history-li"></li>
                    <li class="history-li"></li>
                    <li class="history-li"></li>
                    <li class="history-li"></li>
                    <li class="history-li"></li>
                    <li class="history-li"></li>
                    <li class="history-li"></li>
                    <li class="history-li"></li>
                    <li class="history-li"></li>
                    <li class="history-li"></li>
                </ul>
            </div>
        </div>

    </main>
</body>
<script type="module" src="./src/js/15_calculator-app.js"></script>

</html>
