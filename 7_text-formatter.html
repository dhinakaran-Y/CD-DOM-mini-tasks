<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text-Formatter</title>
    <link rel="stylesheet" href="./src/css/style.css">
</head>

<body class="bg-gray-200 text-white bg-[url(/public/images/bg-6.png)] bg-fixed bg-no-repeat bg-center bg-cover">
    <header class="w-full bg-white/10 backdrop-blur-xl h-10 content-center shadow shadow-black/20">
        <nav class="w-[90vw] mx-auto flex justify-between">
            <!-- left -->
            <div class="font-semibold text-xl">Text Formatter</div>
            <!-- right -->
            <div class="*:font-semibold space-x-2  *:px-2 *:py-1 *:hover:text-brand" id="nav-list">
                <a href="./index.html" class="flex justify-center items-center"><svg xmlns="http://www.w3.org/2000/svg"
                        width="15" height="15" viewBox="0 0 24 24" class="mr-1">
                        <path fill="currentColor" d="m7.825 13l5.6 5.6L12 20l-8-8l8-8l1.425 1.4l-5.6 5.6H20v2z" />
                    </svg>back to home</a>
            </div>
        </nav>
    </header>
    <main class="w-xl bg-white/10 backdrop-blur-xl rounded-2xl shadow-lg mx-auto min-h-30 mt-10 p-5 space-y-2">
        <form action="" id="user-form" class="space-y-2 justify-self-center">
            <h2 class="font-bold my-3 text-center text-2xl">Text-Formatter</h2>
            <div class="">
                <label for="text-content">Text-area : </label><br>
                <textarea class="border border-white/30 placeholder:text-white/50 text-white/60 rounded focus:outline-none px-2 resize-none" name="text-content" id="text-content" cols="50" rows="5" placeholder="Enter your content briefly"></textarea>
            </div>
            <button type="button" class="btn bg-red-400" id="clear-btn">clear</button>
        </form>
    </main>

    <div class="w-3xl bg-white/10 backdrop-blur-xl rounded-2xl shadow-lg mx-auto min-h-30 my-10 p-5 space-y-4">
        <div class="justify-self-center">
            <h2 class="text-2xl font-black text-center mb-2">Your Text Content</h2>
            <p class="w-md border border-white/30 rounded h-40 p-5" id="output">
                ✍️write your content in the text area...
            </p>
        </div>
        <!-- action btns -->
        <div+ class="flex justify-center space-x-3">
            <!-- caps -->
            <button type="button" class="btn bg-violet-400" id="upper-case">UpperCase</button>
            <button type="button" class="btn bg-yellow-400" id="lower-case">LowerCase</button>
            <button type="button" class="btn bg-green-400" id="bold-btn">Bold</button>
    </div>
    </div>

    <!-- js -->
    <!-- <script type="module" src="./src/js/navLink.js"></script> -->
    <script type="module" src="/src/js/7_text-formatter.js"></script>
</body>

</html>
