<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Show-hide-password</title>
    <link rel="stylesheet" href="./src/css/style.css">
</head>

<body class="bg-gray-200 bg-[url(/public/images/bg-6.png)] bg-fixed bg-no-repeat bg-center bg-cover">
    <header class="w-full bg-white/10 backdrop-blur-xl h-10 content-center shadow shadow-black/20">
        <nav class="w-[90vw] text-white mx-auto flex justify-between">
            <!-- left -->
            <div class="font-semibold text-xl">Show Hide Password</div>
            <!-- right -->
            <div class="*:font-semibold space-x-2  *:px-2 *:py-1 *:hover:text-brand" id="nav-list">
                <a href="./index.html" class="flex justify-center items-center"><svg xmlns="http://www.w3.org/2000/svg"
                        width="15" height="15" viewBox="0 0 24 24" class="mr-1">
                        <path fill="currentColor" d="m7.825 13l5.6 5.6L12 20l-8-8l8-8l1.425 1.4l-5.6 5.6H20v2z" />
                    </svg>back to home</a>
            </div>
        </nav>
    </header>
    <main class="w-lg bg-white/10 text-white backdrop-blur-xl rounded-2xl shadow-lg mx-auto min-h-30 my-10 p-5 space-y-2">
        <h2 class="font-bold my-3 text-center text-2xl">Dynamic User Manager</h2>
        <form action="" id="user-form" class="space-y-2 justify-self-center select-none">
            <div class="">
                <label for="user-name">Name:</label><br>
                <input type="text" placeholder="Enter your name"
                    class="py-1 bg-teal-50/5 border border-gray-400 rounded focus:outline-none px-2 w-md" id="user-name" name="user-name">
            </div>
            <div class="h-12">
                <label for="password-input">Password :</label><br>
                <div class="relative">
                    <input type="password" placeholder="Enter Your password"
                        class="py-1 bg-teal-50/5 border border-gray-400 rounded focus:outline-none px-2 w-md absolute" name="user-name"
                        id="password-input">
                    <!-- visible -->
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" class="cursor-pointer stroke-white/50 absolute right-3 top-1.5 hidden" id="visible-btn"
                        viewBox="0 0 24 24">
                        <path fill="currentColor"
                            d="M12 9a3 3 0 0 1 3 3a3 3 0 0 1-3 3a3 3 0 0 1-3-3a3 3 0 0 1 3-3m0-4.5c5 0 9.27 3.11 11 7.5c-1.73 4.39-6 7.5-11 7.5S2.73 16.39 1 12c1.73-4.39 6-7.5 11-7.5M3.18 12a9.821 9.821 0 0 0 17.64 0a9.821 9.821 0 0 0-17.64 0" />
                    </svg>
                    <!-- not visible -->
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" class="cursor-pointer stroke-white/50 absolute right-3 top-1.5" id="not-visible-btn"
                     viewBox="0 0 24 24">
                        <path fill="currentColor"
                            d="M2 5.27L3.28 4L20 20.72L18.73 22l-3.08-3.08c-1.15.38-2.37.58-3.65.58c-5 0-9.27-3.11-11-7.5c.69-1.76 1.79-3.31 3.19-4.54zM12 9a3 3 0 0 1 3 3a3 3 0 0 1-.17 1L11 9.17A3 3 0 0 1 12 9m0-4.5c5 0 9.27 3.11 11 7.5a11.8 11.8 0 0 1-4 5.19l-1.42-1.43A9.86 9.86 0 0 0 20.82 12A9.82 9.82 0 0 0 12 6.5c-1.09 0-2.16.18-3.16.5L7.3 5.47c1.44-.62 3.03-.97 4.7-.97M3.18 12A9.82 9.82 0 0 0 12 17.5c.69 0 1.37-.07 2-.21L11.72 15A3.064 3.064 0 0 1 9 12.28L5.6 8.87c-.99.85-1.82 1.91-2.42 3.13" />
                    </svg>
                </div>
            </div>
            <button id="add-user-btn"
                class="px-3 py-1 bg-[#2fbf98] text-white font-semibold rounded hover:cursor-pointer hover:bg-[#05b082] mt-4">Add
                User</button>
        </form>
    </main>

    <!-- js -->
    <!-- <script type="module" src="./src/js/3_employee-info.js"></script> -->
    <script type="module" src="./src/js/8_show-hide-password.js"></script>
</body>

</html>
